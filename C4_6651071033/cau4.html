<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Câu 4</title>
</head>

<body>

    <h2>Câu 4: Các số lẻ nhỏ hơn 100</h2>

    <script>

        for (let i = 1; i < 100; i++) {

            if (i % 2 != 0 && i != 5 && i != 7 && i != 93) {
                document.write(i + " ");
            }

        }

    </script>

</body>

</html>
