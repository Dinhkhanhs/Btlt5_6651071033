<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Câu 5</title>
</head>

<body>

    <h2>Câu 5: Kiểm tra số nguyên tố</h2>

    <script>

        let n = Number(prompt("Nhập một số nguyên dương:"));

        let laSoNguyenTo = true;

        if (n < 2) {

            laSoNguyenTo = false;

        } else {

            for (let i = 2; i <= Math.sqrt(n); i++) {

                if (n % i == 0) {
                    laSoNguyenTo = false;
                    break;
                }

            }

        }

        if (laSoNguyenTo) {
            alert(n + " là số nguyên tố");
        } else {
            alert(n + " không phải là số nguyên tố");
        }

    </script>

</body>

</html>
