    <h2>Câu 3: Tìm số lớn nhất</h2>

    <script>

        let a = 15;
        let b = 28;
        let c = 9;

        let max = a;

        if (b > max) {
            max = b;
        }

        if (c > max) {
            max = c;
        }

        alert("Số lớn nhất là: " + max);

    </script>
