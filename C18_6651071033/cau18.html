<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Câu 18</title>
</head>

<body>

    <h2>Câu 18</h2>

    <script>
        let n = Number(prompt("Nhập số nguyên dương n:"));

        let giaiThua = 1;

        for (let i = 1; i <= n; i++) {
            giaiThua = giaiThua * i;
        }

        alert(n + "! = " + giaiThua);
    </script>

</body>

</html>
